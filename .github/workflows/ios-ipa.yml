name: iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Liste adresi kodda değil: Gradle bunu DEFAULT_URL olarak derlemeye ekler (composeApp/build.gradle.kts)
      MURATTV_LIST_URL: ${{ secrets.MURATTV_LIST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          chmod +x gradlew
          cd iosApp && xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project iosApp/MuratTv.xcodeproj \
            -scheme MuratTv \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MuratTv.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            >"$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              echo "::group::Errors"; grep -E "(^e: |error:)" "$RUNNER_TEMP/xcodebuild.log" | head -100; echo "::endgroup::"
              tail -150 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/MuratTv.xcarchive/Products/Applications/MuratTv.app" Payload/
          zip -qry MuratTv-unsigned.ipa Payload
          ls -lh MuratTv-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MuratTv-unsigned-ipa
          path: MuratTv-unsigned.ipa
          if-no-files-found: error
          # Depo public: IPA'nın içinde liste adresi var, indirme bağlantısı uzun süre açık kalmasın
          retention-days: 1
